name: i11-hash-chain-browser-smoke

on:
  pull_request:
    paths:
      - 'app/application/hash-chain.js'
      - 'app/infrastructure/browser/sha256.js'
      - 'tests/i11_hash_chain_browser_smoke.html'
      - '.github/workflows/i11-hash-chain-browser-smoke.yml'

concurrency:
  group: i11-hash-chain-browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-hash-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chromium manipulation, ordering and 1000-event profile
        shell: bash
        run: |
          set -Eeuo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python3 -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/i11-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..80}; do
            curl -fsS http://127.0.0.1:8765/tests/i11_hash_chain_browser_smoke.html >/dev/null 2>&1 && break
            sleep 0.1
          done
          output="$("$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom http://127.0.0.1:8765/tests/i11_hash_chain_browser_smoke.html)"
          printf '%s\n' "$output"
          grep -q 'data-result="PASS"' <<<"$output"
          grep -Eq 'data-events="1000"' <<<"$output"
          grep -Eq 'data-budget-ms="[0-9]+"' <<<"$output"
