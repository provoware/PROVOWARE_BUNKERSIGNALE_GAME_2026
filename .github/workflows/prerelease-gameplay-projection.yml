name: prerelease-gameplay-projection

on:
  pull_request:
    paths:
      - 'app/domain/gameplay-command.mjs'
      - 'app/domain/gameplay-projection.mjs'
      - 'tests/gameplay_command.test.mjs'
      - 'tests/gameplay_projection.test.mjs'
      - 'docs/PRERELEASE_GAMEPLAY_PROJECTION_20261023.md'
      - '.github/workflows/prerelease-gameplay-projection.yml'
      - 'changes/CHG-20261023-006.json'

permissions:
  contents: read

jobs:
  gameplay-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app/domain/gameplay-command.mjs
          node --check app/domain/gameplay-projection.mjs
          node --check tests/gameplay_projection.test.mjs
      - name: Execute command and projection regressions
        run: node --test tests/gameplay_command.test.mjs tests/gameplay_projection.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen I10 shell remains unchanged
        run: python3 -m unittest discover -s tests -p test_i10_ui_shell.py -v
      - name: Matrix remains fail closed
        run: python3 tools/prerelease_gate.py
