name: prerelease-gameplay-command

on:
  pull_request:
    paths:
      - 'app/domain/gameplay-command.mjs'
      - 'tests/gameplay_command.test.mjs'
      - 'docs/PRERELEASE_GAMEPLAY_COMMANDS_20261023.md'
      - '.github/workflows/prerelease-gameplay-command.yml'
      - 'changes/CHG-20261023-005.json'

permissions:
  contents: read

jobs:
  pure-gameplay-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app/domain/gameplay-command.mjs
      - name: Twelve deterministic and negative command tests
        run: node --test tests/gameplay_command.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen I10 shell regression
        run: python3 -m unittest discover -s tests -p test_i10_ui_shell.py -v
      - name: Prerelease gate stays fail closed
        run: python3 tools/prerelease_gate.py
