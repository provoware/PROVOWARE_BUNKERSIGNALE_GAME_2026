name: i01-browser-smoke

on:
  pull_request:
    paths:
      - 'index.html'
      - 'VERSION'
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/i01-browser-smoke.yml'

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real Chromium boot smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          python3 -m http.server 8765 --bind 127.0.0.1 >"$RUNNER_TEMP/i01-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..50}; do
            curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 0.1
          done
          timeout 30s "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3000 --dump-dom http://127.0.0.1:8765/index.html >"$RUNNER_TEMP/i01-dom.html"
          grep -q 'System bereit für I01' "$RUNNER_TEMP/i01-dom.html"
          grep -q '0.1.0-alpha.0' "$RUNNER_TEMP/i01-dom.html"
          grep -q 'Diagnose &amp; Recovery' "$RUNNER_TEMP/i01-dom.html"
          ! grep -q 'Start nicht möglich' "$RUNNER_TEMP/i01-dom.html"
