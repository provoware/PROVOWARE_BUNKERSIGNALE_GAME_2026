<!doctype html>
<meta charset="utf-8">
<title>I12 CryptoKey Persistence Proof</title>
<output id="result" data-result="RUNNING">RUNNING</output>
<script type="module">
const result = document.querySelector("#result");
const DB_NAME = "i12-cryptokey-persistence-proof";
const STORE = "keys";
const KEY_ID = "active";
const message = new TextEncoder().encode("provoware:i12:persistence-proof:v1");
const request = req => new Promise((resolve, reject) => {
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
const transactionDone = tx => new Promise((resolve, reject) => {
  tx.oncomplete = resolve;
  tx.onabort = () => reject(tx.error ?? new Error("transaction aborted"));
  tx.onerror = () => reject(tx.error ?? new Error("transaction failed"));
});
const openDb = async () => {
  const req = indexedDB.open(DB_NAME, 1);
  req.onupgradeneeded = () => req.result.createObjectStore(STORE, { keyPath: "key_id" });
  return request(req);
};
try {
  if (!globalThis.crypto?.subtle || !globalThis.indexedDB) throw new Error("required browser capability unavailable");
  indexedDB.deleteDatabase(DB_NAME);
  const pair = await crypto.subtle.generateKey({ name: "Ed25519" }, false, ["sign", "verify"]);
  if (pair.privateKey.extractable) throw new Error("private key unexpectedly extractable");

  let db = await openDb();
  let tx = db.transaction(STORE, "readwrite");
  tx.objectStore(STORE).add({ key_id: KEY_ID, private_key: pair.privateKey, public_key: pair.publicKey });
  await transactionDone(tx);
  db.close();

  db = await openDb();
  tx = db.transaction(STORE, "readonly");
  const stored = await request(tx.objectStore(STORE).get(KEY_ID));
  await transactionDone(tx);
  if (!stored?.private_key || stored.private_key.extractable) throw new Error("persisted private key invalid");
  const signature = await crypto.subtle.sign({ name: "Ed25519" }, stored.private_key, message);
  if (!await crypto.subtle.verify({ name: "Ed25519" }, stored.public_key, signature, message)) throw new Error("reopened key cannot sign/verify");

  let exportRejected = false;
  try { await crypto.subtle.exportKey("pkcs8", stored.private_key); } catch { exportRejected = true; }
  if (!exportRejected) throw new Error("private key export unexpectedly succeeded");

  let noClobber = false;
  tx = db.transaction(STORE, "readwrite");
  tx.objectStore(STORE).add({ key_id: KEY_ID, private_key: pair.privateKey, public_key: pair.publicKey });
  try { await transactionDone(tx); } catch { noClobber = true; }
  if (!noClobber) throw new Error("duplicate key silently replaced active key");

  tx = db.transaction(STORE, "readonly");
  const missing = await request(tx.objectStore(STORE).get("missing"));
  await transactionDone(tx);
  if (missing !== undefined) throw new Error("missing-key path did not fail closed");
  db.close();
  indexedDB.deleteDatabase(DB_NAME);

  result.dataset.result = "PASS";
  result.dataset.reopened = "true";
  result.dataset.nonExtractable = "true";
  result.dataset.noClobber = "true";
  result.dataset.missingKey = "closed";
  result.textContent = "PASS";
} catch (error) {
  result.dataset.result = "FAIL";
  result.textContent = `FAIL ${error.message}`;
}
</script>
